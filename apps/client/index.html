<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/s3e.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Secure, self-hosted S3 file explorer for managing buckets and objects" />
  <title>S3 Explorer</title>
  <style>
    /* Critical CSS - prevents flash of wrong color.
       Must match --background in the .dark, [data-theme="dark"] block of
       index.css (oklch(0.145 0 0) = #0a0a0a), or the app flashes light before
       the stylesheet loads. Kept as oklch rather than the hex so the two can be
       compared without a conversion step. */
    html, body, #root {
      background-color: oklch(0.145 0 0);
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
